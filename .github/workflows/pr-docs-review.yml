name: kachko PR documentation review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: kachko-docs-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Analyze PR against project docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      report: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Check review prerequisites
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$SAME_REPO" != "true" ]; then
            echo 'Fork PRs require a maintainer review; this workflow does not expose secrets to forks.'
            exit 1
          fi
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'Configure the OPENAI_API_KEY repository Actions secret to enable review.'
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify review inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          test -f .github/review/prompt.md
          test -f .github/review/schema.json
          test -f docs/01-HLD.md
          test -f docs/02-LLD.md
          test -f docs/03-DEVELOPMENT-BLUEPRINT.md
      - name: Capture PR context
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const pr = context.payload.pull_request;
            const checks = await github.paginate(github.rest.checks.listForRef, {
              ...context.repo, ref: pr.head.sha, per_page: 100
            });
            fs.writeFileSync('.review-context.json', JSON.stringify({
              number: pr.number, title: pr.title, body: pr.body,
              head_sha: pr.head.sha, base_sha: pr.base.sha,
              checks: checks.map(c => ({ name: c.name, status: c.status, conclusion: c.conclusion }))
            }, null, 2));
      - name: Review with Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/review/prompt.md
          sandbox: read-only
          safety-strategy: drop-sudo
          output-schema-file: .github/review/schema.json

  publish:
    name: Publish review findings
    needs: review
    if: always() && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      verdict: ${{ steps.publish.outputs.verdict }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Publish current review summary
        id: publish
        uses: actions/github-script@v7
        env:
          REVIEW_REPORT: ${{ needs.review.outputs.report }}
          REVIEW_RESULT: ${{ needs.review.result }}
        with:
          script: |
            const { publishReview } = require('./.github/review/publish.cjs');
            await publishReview({ github, context, core, raw: process.env.REVIEW_REPORT,
              result: process.env.REVIEW_RESULT });

  gate:
    name: Documentation review gate
    needs: [review, publish]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require a complete passing review
        env:
          REVIEW_RESULT: ${{ needs.review.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          VERDICT: ${{ needs.publish.outputs.verdict }}
        run: |
          if [ "$REVIEW_RESULT" != "success" ] || [ "$PUBLISH_RESULT" != "success" ] || [ "$VERDICT" != "pass" ]; then
            echo 'Documentation review has findings, is incomplete, or could not run. See the PR comment and workflow logs.'
            exit 1
          fi
