name: analytics retention

on:
  schedule:
    - cron: "25 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-retention-production
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require production database secret
        run: test -n "$DATABASE_URL"
      - name: Delete analytics events outside the retention window
        run: pnpm db:analytics:prune
